<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="clinicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#032b49" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="14" fill="url(#clinicGrad)"/>
  <rect width="64" height="32" rx="14" fill="url(#sheenGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Aesthetic Skincare Heart with Medical Pulse -->
  <g filter="url(#subtleShadow)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart silhouette -->
    <path d="M32 50 C20 41.5 11 33 11 23 C11 15.5 17 10 24 10 C28 10 30.8 12 32 14 C33.2 12 36 10 40 10 C47 10 53 15.5 53 23 C53 33 44 41.5 32 50 Z" 
          fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="3"/>
    <!-- Central Medical Pulse line -->
    <path d="M15 26.5 L23.5 26.5 L26.5 20 L30.5 34 L35.5 22 L38.5 27.5 L49 27.5" 
          stroke="#ffffff" stroke-width="3.2"/>
  </g>

  <!-- Aesthetic Sparkle / Star ✦ in top-right -->
  <path d="M48 6 Q48 12 42 12 Q48 12 48 18 Q48 12 54 12 Q48 12 48 6 Z" fill="#fef08a" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="48" cy="12" r="1.3" fill="#ffffff"/>
</svg>